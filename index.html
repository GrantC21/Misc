<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps by Carson Grant</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 20px 80px;
    font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #141518;
    background: #F5F3EE;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 30px; margin: 0 0 28px; letter-spacing: -0.02em; }
  h2 { font-size: 19px; margin: 0 0 4px; letter-spacing: -0.01em; }
  a { color: #A87512; }
  .card { background: #fff; border: 1px solid rgba(20,21,24,0.08); border-radius: 16px; padding: 20px 24px; margin-bottom: 16px; }
  .card p { margin: 0; color: #6b6a66; }
  @media (prefers-color-scheme: dark) {
    body { background: #141518; color: #EDEDED; }
    a { color: #F2B544; }
    .card { background: #1e1f23; border-color: rgba(255,255,255,0.08); }
    .card p { color: #9a9a9a; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Apps</h1>

  <div class="card">
    <h2>Ace: Volleyball Tracker</h2>
    <p><a href="ace/">Support</a> · <a href="ace/privacy.html">Privacy Policy</a></p>
  </div>

  <div class="card">
    <h2>Automotive Sales Playbook</h2>
    <p><a href="asplaybook/">Support</a> · <a href="asplaybook/privacy.html">Privacy Policy</a></p>
  </div>

  <div class="card">
    <h2>Sales Tower</h2>
    <p><a href="salestower/">Support</a> · <a href="salestower/privacy.html">Privacy Policy</a></p>
  </div>
</div>
</body>
</html>
